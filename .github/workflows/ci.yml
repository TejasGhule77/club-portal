# ClubPortal CI/CD Automated Workflow
# Engineered by: Purna Shaha (PRN: 2303112) - Git/GitHub Engineer
name: ClubPortal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Frontend Bundle
        run: npm run build

  backend:
    name: Backend Syntax & Health Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Backend Entry Point
        run: node --check src/index.js

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose Services
        run: docker compose build
