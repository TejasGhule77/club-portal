apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: clubportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clubportal-frontend
  template:
    metadata:
      labels:
        app: clubportal-frontend
    spec:
      containers:
        - name: frontend
          image: clubportal-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: clubportal
spec:
  type: NodePort
  selector:
    app: clubportal-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
