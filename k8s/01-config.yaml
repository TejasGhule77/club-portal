apiVersion: v1
kind: Namespace
metadata:
  name: clubportal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clubportal-config
  namespace: clubportal
data:
  PORT: "5000"
  MONGODB_URI: "mongodb://mongo-service:27017/clubportal"
  CLIENT_URL: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: clubportal-secret
  namespace: clubportal
type: Opaque
stringData:
  JWT_SECRET: "supersecretjwtkey12345!"
  ADMIN_INVITE_CODE: "ADMIN-CLUB-PORTAL-2026"
